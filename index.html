<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1321">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خريطة RSI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>خريطة RSI للعملات الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1321; --surface:#151d31; --line:#232d45;
    --text:#e8edf7; --muted:#8b97b0;
    --os:#13a06f; --ob:#e2445c; --mid:#26324a;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-text-size-adjust:100%}
  body{min-height:100dvh;padding-bottom:calc(24px + var(--safe-b))}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

  header{position:sticky;top:0;z-index:5;background:rgba(13,19,33,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:0}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#6b7590}
  .live[data-s=live] .dot{background:#2bd98f}
  .live[data-s=retry] .dot,.live[data-s=loading] .dot{background:#f0b34a;animation:pulse 1s infinite}
  .live[data-s=error] .dot{background:var(--ob)}
  @keyframes pulse{50%{opacity:.25}}

  .seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
    border-radius:12px;padding:3px;gap:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;
    font-weight:500;padding:9px 0;border-radius:9px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--text);color:var(--bg);font-weight:700}

  main{padding:14px 14px 0;max-width:980px;margin:0 auto}

  .breadth{margin-bottom:14px}
  .bar3{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--mid);gap:2px}
  .bar3 i{display:block;min-width:0;transition:flex-grow .6s}
  .bar3 .a{background:var(--os)} .bar3 .b{background:var(--mid)} .bar3 .c{background:var(--ob)}
  .stats{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .stats b{color:var(--text);font-weight:700;font-size:15px;margin-inline-start:4px}
  .avg{margin-top:6px;font-size:12.5px;color:var(--muted)}
  .avg b{color:var(--text)}

  .tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex:1 1 auto}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;
    font-size:12.5px;padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed=true]{border-color:var(--text);color:var(--text)}
  select{background:var(--surface);color:var(--text);border:1px solid var(--line);
    border-radius:10px;font:inherit;font-size:12.5px;padding:7px 8px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
  .tile{position:relative;border:0;text-align:start;color:#f4f7fc;background:var(--c,var(--mid));
    border-radius:10px;padding:9px 10px 14px;min-height:82px;font:inherit;cursor:pointer;
    display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .tile:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .sym{font-size:13px;font-weight:700}
  .rsi{font-size:23px;font-weight:700;line-height:1.15}
  .chg{font-size:11.5px;opacity:.78}
  .meter{position:absolute;inset-inline:0;bottom:0;height:4px;background:rgba(0,0,0,.28)}
  .meter u{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,255,255,.85);display:block}
  .meter::before,.meter::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45)}
  .meter::before{inset-inline-start:30%} .meter::after{inset-inline-start:70%}

  .msg{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px;line-height:1.8}
  .msg button{margin-top:12px;border:0;background:var(--text);color:var(--bg);font:inherit;
    font-weight:700;padding:10px 20px;border-radius:10px;cursor:pointer}

  .legend{margin-top:20px}
  .legend .ramp{height:10px;border-radius:5px}
  .legend .ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
  .note{margin:14px 0 0;font-size:11.5px;color:var(--muted);line-height:1.8}

  .sheet{position:fixed;inset:0;z-index:10;background:rgba(5,8,16,.6);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .card{width:100%;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + var(--safe-b));animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .card h2{margin:0;font-size:18px}
  .card .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .big{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}
  .big .v{font-size:44px;font-weight:700;line-height:1}
  .big .z{font-size:14px;font-weight:700}
  .gauge{position:relative;height:10px;border-radius:5px;
    background:linear-gradient(to right,var(--os) 0,var(--os) 30%,var(--mid) 30%,var(--mid) 70%,var(--ob) 70%,var(--ob) 100%)}
  .gauge u{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;
    transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}
  .rows{margin-top:16px;border-top:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row span:first-child{color:var(--muted)}
  .actions{display:flex;gap:8px;margin-top:16px}
  .actions a,.actions button{flex:1;text-align:center;text-decoration:none;font:inherit;font-size:14px;font-weight:700;
    padding:12px;border-radius:12px;border:0;cursor:pointer}
  .actions a{background:var(--text);color:var(--bg)}
  .actions button{background:var(--mid);color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>خريطة RSI</h1>
    <div class="live" id="live" data-s="loading"><span class="dot"></span><span id="liveTxt">جارٍ التحميل</span></div>
  </div>
  <div class="seg" id="seg" role="group" aria-label="الإطار الزمني"></div>
</header>

<main>
  <section class="breadth" id="breadth" hidden>
    <div class="bar3"><i class="a" id="bA"></i><i class="b" id="bB"></i><i class="c" id="bC"></i></div>
    <div class="stats">
      <span>تشبّع بيعي<b class="num" id="nA">0</b></span>
      <span>محايد<b class="num" id="nB">0</b></span>
      <span>تشبّع شرائي<b class="num" id="nC">0</b></span>
    </div>
    <div class="avg">متوسط RSI للسوق: <b class="num" id="avg">—</b></div>
  </section>

  <div class="tools">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">الكل</button>
      <button class="chip" data-f="os" aria-pressed="false">أقل من 30</button>
      <button class="chip" data-f="ob" aria-pressed="false">أكثر من 70</button>
    </div>
    <select id="sort" aria-label="الترتيب">
      <option value="vol">حجم التداول</option>
      <option value="low">RSI الأقل</option>
      <option value="high">RSI الأعلى</option>
      <option value="chg">تغيّر 24 ساعة</option>
    </select>
    <select id="count" aria-label="عدد العملات">
      <option value="30">30 عملة</option>
      <option value="50">50 عملة</option>
      <option value="100">100 عملة</option>
    </select>
  </div>

  <div id="msg" class="msg">جارٍ تحميل السوق…</div>
  <div class="grid" id="grid"></div>

  <section class="legend">
    <div class="ramp" id="ramp"></div>
    <div class="ticks"><span class="num">0</span><span class="num">30</span><span class="num">50</span><span class="num">70</span><span class="num">100</span></div>
    <p class="note">RSI(14) محسوب من شموع Binance لأزواج USDT الأعلى تداولًا، ويتحدّث لحظيًا مع كل تداول. القيم الأقل من 30 تُقرأ تشبّعًا بيعيًا، والأعلى من 70 تشبّعًا شرائيًا. للاطلاع فقط وليس نصيحة مالية.</p>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" id="card"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const TFS = [['15m','15 دقيقة'],['1h','ساعة'],['4h','4 ساعات'],['1d','يوم']];
  const TF_NAME = Object.fromEntries(TFS);
  const PERIOD = 14;
  const STABLE = new Set(['USDC','FDUSD','TUSD','USDP','DAI','BUSD','EUR','AEUR','USDE','XUSD','USD1','PYUSD','UST','GBP','TRY','BRL']);
  const REST = ['https://api.binance.com','https://data-api.binance.vision'];
  const WSS  = ['wss://stream.binance.com:9443/stream','wss://data-stream.binance.vision/stream'];

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('rsimap') || '{}'); } catch(_) {}
  const S = { tf: saved.tf || '1h', sort: saved.sort || 'vol', n: saved.n || 50, filter: 'all', sel: null };
  const save = () => { try { localStorage.setItem('rsimap', JSON.stringify({tf:S.tf, sort:S.sort, n:S.n})); } catch(_) {} };

  /* ---------- RSI (Wilder) ---------- */
  function rsi(c, p = PERIOD){
    if (c.length <= p) return null;
    let g = 0, l = 0;
    for (let i = 1; i <= p; i++){ const d = c[i] - c[i-1]; d >= 0 ? g += d : l -= d; }
    g /= p; l /= p;
    for (let i = p + 1; i < c.length; i++){
      const d = c[i] - c[i-1];
      g = (g * (p - 1) + (d > 0 ? d : 0)) / p;
      l = (l * (p - 1) + (d < 0 ? -d : 0)) / p;
    }
    return l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }

  /* ---------- colour scale ---------- */
  const STOPS = [[0,[14,168,114]],[30,[22,128,98]],[44,[38,50,74]],[56,[38,50,74]],[70,[150,52,72]],[100,[228,68,94]]];
  function color(v){
    for (let i = 1; i < STOPS.length; i++){
      if (v <= STOPS[i][0]){
        const [a, ca] = STOPS[i-1], [b, cb] = STOPS[i];
        const t = (v - a) / (b - a);
        return `rgb(${ca.map((x, k) => Math.round(x + (cb[k] - x) * t)).join(',')})`;
      }
    }
    return `rgb(${STOPS[STOPS.length-1][1].join(',')})`;
  }
  $('#ramp').style.background = 'linear-gradient(to right,' + STOPS.map(([p, c]) => `rgb(${c}) ${p}%`).join(',') + ')';

  /* ---------- helpers ---------- */
  function fmtPrice(p){
    if (p >= 1000) return p.toLocaleString('en-US', {maximumFractionDigits: 2});
    if (p >= 1)    return p.toLocaleString('en-US', {maximumFractionDigits: 4});
    return Number(p.toPrecision(5)).toString();
  }
  function fmtVol(v){
    if (v >= 1e9) return (v / 1e9).toFixed(2) + ' مليار';
    if (v >= 1e6) return (v / 1e6).toFixed(1) + ' مليون';
    return Math.round(v).toLocaleString('en-US');
  }
  const zone = v => v < 30 ? ['تشبّع بيعي', '#2bd98f'] : v > 70 ? ['تشبّع شرائي', '#ff6b82'] : ['منطقة محايدة', '#c3cce0'];
  const sgn = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

  let restIdx = 0;
  async function api(path){
    let err;
    for (let i = 0; i < REST.length; i++){
      const k = (restIdx + i) % REST.length;
      try {
        const r = await fetch(REST[k] + path);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        restIdx = k;
        return await r.json();
      } catch(e){ err = e; }
    }
    throw err;
  }

  /* ---------- state ---------- */
  let coins = new Map();
  let loadId = 0;

  function setStatus(s){
    const el = $('#live');
    el.dataset.s = s;
    $('#liveTxt').textContent = { live:'مباشر', retry:'إعادة الاتصال', loading:'جارٍ التحميل', error:'غير متصل' }[s];
  }
  function showMsg(html){ const m = $('#msg'); m.innerHTML = html; m.hidden = false; }
  function hideMsg(){ $('#msg').hidden = true; }

  async function loadKlines(c){
    try {
      const k = await api(`/api/v3/klines?symbol=${c.sym}&interval=${S.tf}&limit=150`);
      if (!k.length) return;
      c.closes = k.map(x => +x[4]);
      c.open = k[k.length - 1][0];
      c.price = c.closes[c.closes.length - 1];
      c.rsi = rsi(c.closes);
    } catch(_) {}
  }

  async function loadAll(){
    const id = ++loadId;
    closeWS();
    setStatus('loading');
    $('#grid').innerHTML = '';
    $('#breadth').hidden = true;
    showMsg('جارٍ تحميل السوق…');
    try {
      const t = await api('/api/v3/ticker/24hr');
      if (id !== loadId) return;
      const list = t
        .filter(x => x.symbol.endsWith('USDT'))
        .map(x => ({ sym:x.symbol, base:x.symbol.slice(0, -4), vol:+x.quoteVolume, chg:+x.priceChangePercent, price:+x.lastPrice }))
        .filter(x => x.vol > 0 && !STABLE.has(x.base))
        .sort((a, b) => b.vol - a.vol)
        .slice(0, S.n);
      coins = new Map(list.map(c => [c.sym, { ...c, closes: [], rsi: null, open: 0 }]));
      for (let i = 0; i < list.length; i += 10){
        await Promise.all(list.slice(i, i + 10).map(c => loadKlines(coins.get(c.sym))));
        if (id !== loadId) return;
        schedule(150);
      }
      connectWS();
    } catch(e){
      if (id !== loadId) return;
      setStatus('error');
      $('#grid').innerHTML = '';
      showMsg('تعذّر الاتصال بـ Binance.<br>تأكد من الإنترنت، وإن كان الموقع محجوبًا في بلدك فجرّب VPN.<br><button id="retry">إعادة المحاولة</button>');
      $('#retry').onclick = loadAll;
    }
  }

  async function refreshCloses(){
    const arr = [...coins.values()];
    for (let i = 0; i < arr.length; i += 10) await Promise.all(arr.slice(i, i + 10).map(loadKlines));
    schedule(100);
  }

  async function refreshTickers(){
    try {
      const t = await api('/api/v3/ticker/24hr');
      for (const x of t){
        const c = coins.get(x.symbol);
        if (c){ c.chg = +x.priceChangePercent; c.vol = +x.quoteVolume; }
      }
      schedule(100);
    } catch(_) {}
  }

  /* ---------- WebSocket ---------- */
  let ws = null, wsGen = 0, wsIdx = 0, lastMsg = 0, opened = false;
  function closeWS(){
    wsGen++;
    if (ws){ try { ws.onclose = null; ws.onerror = null; ws.close(); } catch(_) {} ws = null; }
  }
  function connectWS(){
    closeWS();
    const gen = wsGen;
    const sock = new WebSocket(WSS[wsIdx % WSS.length]);
    ws = sock;
    sock.onopen = () => {
      const params = [...coins.keys()].map(s => `${s.toLowerCase()}@kline_${S.tf}`);
      for (let i = 0; i < params.length; i += 50)
        sock.send(JSON.stringify({ method:'SUBSCRIBE', params: params.slice(i, i + 50), id: i + 1 }));
      lastMsg = Date.now();
      setStatus('live');
      hideMsg();
      if (opened) refreshCloses();
      opened = true;
    };
    sock.onmessage = e => {
      lastMsg = Date.now();
      let m; try { m = JSON.parse(e.data); } catch(_) { return; }
      if (m.data && m.data.k) onKline(m.data.k);
    };
    const lost = () => {
      if (gen !== wsGen) return;
      setStatus('retry');
      wsIdx++;
      setTimeout(() => { if (gen === wsGen) connectWS(); }, 2500);
    };
    sock.onclose = lost;
    sock.onerror = () => { try { sock.close(); } catch(_) {} };
  }
  function onKline(k){
    const c = coins.get(k.s);
    if (!c || !c.closes.length) return;
    const cl = +k.c;
    if (k.t === c.open) c.closes[c.closes.length - 1] = cl;
    else if (k.t > c.open){ c.closes.push(cl); if (c.closes.length > 200) c.closes.shift(); c.open = k.t; }
    else return;
    c.price = cl;
    c.rsi = rsi(c.closes);
    schedule(1000);
  }
  setInterval(() => {
    if (ws && ws.readyState === 1 && Date.now() - lastMsg > 25000) { try { ws.close(); } catch(_) {} }
  }, 10000);
  setInterval(refreshTickers, 60000);

  /* ---------- render ---------- */
  let timer = null;
  function schedule(ms){ if (!timer) timer = setTimeout(() => { timer = null; render(); }, ms); }

  function render(){
    const all = [...coins.values()].filter(c => c.rsi != null);
    if (!all.length) return;
    hideMsg();

    // breadth
    let a = 0, b = 0, c3 = 0, sum = 0;
    for (const c of all){ c.rsi < 30 ? a++ : c.rsi > 70 ? c3++ : b++; sum += c.rsi; }
    $('#breadth').hidden = false;
    $('#bA').style.flexGrow = a; $('#bB').style.flexGrow = b; $('#bC').style.flexGrow = c3;
    $('#nA').textContent = a; $('#nB').textContent = b; $('#nC').textContent = c3;
    $('#avg').textContent = (sum / all.length).toFixed(1);

    // filter + sort
    let arr = all;
    if (S.filter === 'os') arr = arr.filter(c => c.rsi < 30);
    if (S.filter === 'ob') arr = arr.filter(c => c.rsi > 70);
    const by = { vol:(x, y) => y.vol - x.vol, low:(x, y) => x.rsi - y.rsi, high:(x, y) => y.rsi - x.rsi, chg:(x, y) => y.chg - x.chg }[S.sort];
    arr = [...arr].sort(by);

    $('#grid').innerHTML = arr.length ? arr.map(c => `
      <button class="tile" data-s="${c.sym}" style="--c:${color(c.rsi)}" aria-label="${c.base} RSI ${c.rsi.toFixed(1)}">
        <span class="sym num">${c.base}</span>
        <span class="rsi num">${c.rsi.toFixed(1)}</span>
        <span class="chg num">${sgn(c.chg)}</span>
        <span class="meter"><u style="width:${c.rsi.toFixed(1)}%"></u></span>
      </button>`).join('') : '<div class="msg">لا توجد عملات في هذه المنطقة حاليًا.</div>';

    if (S.sel) renderSheet();
  }

  /* ---------- detail sheet ---------- */
  function renderSheet(){
    const c = coins.get(S.sel);
    if (!c || c.rsi == null) return;
    const [zt, zc] = zone(c.rsi);
    $('#card').innerHTML = `
      <h2 class="num">${c.base}/USDT</h2>
      <div class="sub">الإطار الزمني: ${TF_NAME[S.tf] || S.tf}</div>
      <div class="big"><span class="v num">${c.rsi.toFixed(1)}</span><span class="z" style="color:${zc}">${zt}</span></div>
      <div class="gauge"><u style="inset-inline-start:${Math.min(100, Math.max(0, c.rsi))}%"></u></div>
      <div class="rows">
        <div class="row"><span>السعر</span><span class="num">$${fmtPrice(c.price)}</span></div>
        <div class="row"><span>تغيّر 24 ساعة</span><span class="num">${sgn(c.chg)}</span></div>
        <div class="row"><span>حجم التداول 24 ساعة</span><span>$${fmtVol(c.vol)}</span></div>
      </div>
      <div class="actions">
        <a href="https://www.binance.com/en/trade/${c.base}_USDT" target="_blank" rel="noopener">فتح في Binance</a>
        <button id="closeSheet">إغلاق</button>
      </div>`;
    $('#closeSheet').onclick = closeSheet;
  }
  function openSheet(sym){ S.sel = sym; $('#sheet').hidden = false; renderSheet(); }
  function closeSheet(){ S.sel = null; $('#sheet').hidden = true; }
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('#grid').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (t) openSheet(t.dataset.s);
  });

  /* ---------- controls ---------- */
  function buildSeg(){
    $('#seg').innerHTML = TFS.map(([v, n]) => `<button data-tf="${v}" aria-pressed="${v === S.tf}">${n}</button>`).join('');
  }
  $('#seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.tf === S.tf) return;
    S.tf = b.dataset.tf; save(); buildSeg(); opened = false; loadAll();
  });
  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    S.filter = b.dataset.f;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  $('#sort').onchange = e => { S.sort = e.target.value; save(); render(); };
  $('#count').onchange = e => { S.n = +e.target.value; save(); opened = false; loadAll(); };
  $('#sort').value = S.sort;
  $('#count').value = String(S.n);

  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 60000){ opened = false; loadAll(); }
    else if (!ws || ws.readyState > 1) connectWS();
  });
  window.addEventListener('online', () => { if (!ws || ws.readyState > 1) loadAll(); });

  buildSeg();
  loadAll();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
